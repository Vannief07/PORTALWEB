    - name: "Lauris Romero"
      position: "Estudiante universitaria e integrante del proyecto huerta hidropónica"
      content: "Aunque al principio la huerta hidropónica puede ser un poco costosa
      (también depende que sistema de cultivo hidropónico se utilice, en nuestro caso fue
      el vertical) a la larga con los debidos parámetros y cuidados que se necesita
      de principio y fin en la siembra sea de frutos, hortalizas, etc, sale muy rentable
      para el bolsillo de las personas que desean emprender sin necesidad de tener un terreno o que este sea fértil.
      Ya no es necesario porque aquí no se necesitará cultivar en tierra lo que
      permite que este cultivo sea muy rentable."
