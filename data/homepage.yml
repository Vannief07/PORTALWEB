  works:
    - title: "Huerta Hidropónica"
      description: "La hidroponía es un método versátil con distintos tipos de cultivos hidropónicos
      para las plantas donde no se utiliza suelo, sino que las raíces se sumergen en una solución 
      acuosa rica en nutrientes para su desarrollo. Este cultivo transforma nuevas
      y nos da mejores alternativas para la optimización de los recursos y el trabajo en la siembra. Es totalmente
      opuesto al cultivo tradicional (agrícola) teniendo así grandes ventajas no solo
      para los comerciantes y los compradores sino también para el medio ambiente. Gracias a la
      materia de ciencia y tecnología de los materiales hemos aprendido y conocido
      sobre este valioso e importante cultivo."
      button:
        icon: "icon-arrow-right"
        btnText: "Para más información sobre la hidroponia"
        URL: "https://youtu.be/h-8HeAhzOYU?si=mdOI7gHFLRMJfoxO"
      image:
        x: "img/works/aa.jpg"
        _2x: "img/works/aa.jpg"
      is_even: true

    - title: "Ventajas sobre la realización de esta producción"
      description: "Este cultivo ofrece múltiples ventajas frente a la 
      agricultura tradicional. En primer lugar, nos permite cultivar sin 
      necesidad de hacer uso de la tierra, lo que lo hace ideal para zonas urbanas, 
      o con suelos pobres. Además, reduce significativamente 
      el consumo de agua, ya que esta se recircula y reutiliza constantemente gracias a su estructura hidropónica, 
      haciendo el sistema mucho más eficiente y amigable con la naturaleza.
      Otra gran ventaja es el control total sobre los nutrientes que reciben 
      las plantas. Al administrarlos directamente en la solución nutritiva, 
      se optimiza su absorción y se favorece un crecimiento más rápido y 
      saludable para el consumo humano. Esto también disminuye la necesidad de usar fertilizantes 
      en exceso o pesticidas, ya que el ambiente controlado reduce el riesgo 
      de plagas y enfermedades.El cultivo hidropónico también permite una 
      producción continua durante todo el año, independientemente del clima, 
      lo que garantiza mayor estabilidad en la oferta de alimentos. 
      Además, al poderse implementar en espacios pequeños o verticales, 
      aumenta la productividad por metro cuadrado, ideal para aprovechar 
      al máximo el espacio disponible. Finalmente, este tipo de cultivo es más 
      limpio y sostenible, ya que genera menos residuos, evita la erosión del 
      suelo y puede integrarse fácilmente en proyectos ecológicos, educativos o 
      comerciales.
      
      Cabe a aclarar que todo este proyecto ha sido un proceso largo y demandante desde inicios de este semestre,
      hemos cometido errores y aprendido de ellos porque a pesar de que la hidropónia nos
      ofrece tantas cosas buenas no estamos excentos (y al ser nuestra primera vez) de cometer
      errores pero eso mismo hace parte de lo que somos como ingenieros industriales,
      estancarse no es una opción para nosotros, debemos buscar medios para solucionar dicho
      problema porque el ingenio, la capacidad de resolver y optimizar recursos son necesarios
      para poder obtener buenos resultados."
      button:
        icon: "icon-arrow-right"
        btnText: "¿Cómo hacer un cultivo Hidropónico?"
        URL: "https://youtu.be/DuNjVVzDkW8?si=W0fqjFZaIzOV0f8S"
      image:
        x: "img/works/bb.jpg"
        _2x: "img/works/bb.jpg"
      is_even: false

    

