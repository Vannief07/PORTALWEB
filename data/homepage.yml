# about
about:
  enable: true
  title: "¿Quién soy yo?"
  content: 
    <p class="lead">
    <strong>Me gusta el análisis de datos y saber el por qué de las cosas.</strong> Me considero una persona curiosa que le gusta hacer muchas cosas pero a la vez
    esto puede ser una desventaja por no poder encontrar un enfoque en una sola cosa.
    Mi color favorito es el rosa y amo el arroz de pollo como la limonada de coco.
    Mis hobbies favoritos son bailar, leer (en especial el género thriller o de fantasía),
    hacer recetas de comida y dulces que pueda encontrarme en instagram porque barriga llena y corazón contento.
    Además, me gustan los idiomas porque sí bien sé que son esenciales e importantes para la vida laboral
    lo que me motiva a aprender es el hecho de poder comunicarte y aprender sobre sus costumbres porque
    cuando estudias una lengua estás aprendiendo sobre la historia y cultura de ese país.
    Por el moemnto estoy estudiando el inglés e italiano (este último me gusta mucho más)
    </p>
    <p class="lead">
    <strong>Las materias que más me gustan son estadística y química.</strong> La primera me ayuda a resolver explicaciones y predecir sucesos,
    mientras que la otra me ayuda a conocer más sobre el mundo que nos rodea. No soy una experta
    en estas dos materias pero desde que elegí esta carrera me ha llamado el interés
    sobre lo que estas dos áreas pueden proporcionarme. No hay nada más bonito que el conocimiento
    (Aunque a veces cueste entender dichas cosas). Estoy interesada en la docencia
    y/o ser traductora, sin embargo, el propósito que que Dios tenga para mí
    lo aceptaré y agradeceré.
    </p>
  button:
    icon: "icon-smile-fill"
    btnText: "About Me"
    URL: "https://www.instagram.com/vfeoli?igsh=MWEzY2FlaDJ3ZGRrbw=="
  image:
    x: "img/who-am-i/b.jpg"
    _2x: "img/who-am-i/b.jpg"

